# Example Nginx site for Softdayta Risk (Flask via Gunicorn)
# Replace:
# - server_name
# - unix socket path (or use 127.0.0.1:8000)

server {
    listen 80;
    server_name risk.softdayta.co.bw;

    client_max_body_size 25m;

    location /static/ {
        alias /opt/softdayta-risk/pep_screening_portal/static/;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/softdayta-risk/gunicorn.sock;
    }
}

